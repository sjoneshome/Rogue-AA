<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        form {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #fff;
        }
        input[type="text"], input[type="date"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #333;
        }

        /* Error Fallback Modal */
        #fallbackModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #fallbackModal.show {
            display: flex;
        }
        .modal-card {
            background: white;
            max-width: 420px;
            width: 100%;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            text-align: center;
        }
        .modal-card h3 {
            margin: 0 0 8px 0;
            color: #c0392b;
            font-size: 1.3rem;
        }
        .modal-card .subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 22px;
        }
        .verification-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 18px;
            text-align: left;
            margin-bottom: 22px;
        }
        .verification-box p {
            margin: 6px 0;
            font-size: 1.05rem;
        }
        .verification-box strong {
            display: inline-block;
            width: 150px;
            color: #333;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .btn-pdf {
            background: #2c3e50;
            color: white;
        }
        .btn-print {
            background: #3498db;
            color: white;
        }
        .btn-close {
            background: #95a5a6;
            color: white;
        }
    </style>

    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.7/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.7/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.7/plugin/timezone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.7/plugin/customParseFormat.js"></script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <h2>Attendance Verification</h2>
    <form id="attendanceForm">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="firstname" required>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lastname" required>

        <label for="date">Date of Attendance:</label>
        <input type="date" id="date" name="date" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <input type="submit" value="Submit">
    </form>

    <!-- Fallback Modal (shown only on error) -->
    <div id="fallbackModal">
        <div class="modal-card">
            <h3>Email Could Not Be Sent</h3>
            <p class="subtitle">Please screenshot this screen or download the PDF below as your proof of attendance.</p>

            <div class="verification-box" id="verificationContent">
                <!-- filled by JavaScript -->
            </div>

            <div class="btn-row">
                <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
                <button class="btn btn-print" onclick="printVerification()">Print / Save as PDF</button>
                <button class="btn btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Initialize EmailJS
        (function() {
            emailjs.init({
                publicKey: "4K9rlkOr3fbcsD9yw"
            });
        })();

        // Day.js plugins
        dayjs.extend(dayjs_plugin_utc);
        dayjs.extend(dayjs_plugin_timezone);
        dayjs.extend(dayjs_plugin_customParseFormat);

        // Auto-fill today's date in the user's local timezone
        const today = dayjs().tz(dayjs.tz.guess()).format('YYYY-MM-DD');
        document.getElementById('date').value = today;

        // Global variables for PDF / modal
        let currentFirstName = "";
        let currentLastName = "";
        let currentDateDisplay = "";
        let currentEmail = "";

        document.getElementById('attendanceForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const firstName = document.getElementById('fname').value.trim();
            const lastName  = document.getElementById('lname').value.trim();
            const dateInput = document.getElementById('date').value;
            const toEmail   = document.getElementById('email').value.trim();

            // Store for fallback
            currentFirstName   = firstName;
            currentLastName    = lastName;
            currentDateDisplay = dayjs(dateInput).format('MMMM D, YYYY');
            currentEmail       = toEmail;

            // Format for EmailJS (MMDDYY)
            const dateForEmail = dayjs(dateInput).format('MMDDYY');

            emailjs.send("service_8i2xp6l", "template_tr194zi", {
                to_email: toEmail,
                to_name: firstName + " " + lastName,
                date_of_attendance: dateForEmail,
            })
            .then(function(response) {
                alert('Email sent successfully!');
            }, function(error) {
                // Error path → show modal + auto-download PDF
                showFallbackModal(firstName, lastName, currentDateDisplay, toEmail);
                setTimeout(downloadPDF, 400);
            });
        });

        function showFallbackModal(firstName, lastName, dateDisplay, email) {
            const content = document.getElementById('verificationContent');
            content.innerHTML = `
                <p><strong>Name:</strong> ${firstName} ${lastName}</p>
                <p><strong>Date of Attendance:</strong> ${dateDisplay}</p>
                <p><strong>Email:</strong> ${email}</p>
                <p><strong>Submitted:</strong> ${dayjs().format('MMMM D, YYYY h:mm A')}</p>
            `;
            document.getElementById('fallbackModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('fallbackModal').classList.remove('show');
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header
            doc.setFontSize(20);
            doc.setFont("helvetica", "bold");
            doc.text("Attendance Verification", 105, 30, { align: "center" });

            // Divider
            doc.setDrawColor(180);
            doc.line(30, 38, 180, 38);

            // Content
            doc.setFontSize(13);
            doc.setFont("helvetica", "normal");

            let y = 55;
            doc.text(`Name:  ${currentFirstName} ${currentLastName}`, 30, y);
            y += 12;
            doc.text(`Date of Attendance:  ${currentDateDisplay}`, 30, y);
            y += 12;
            doc.text(`Email:  ${currentEmail}`, 30, y);
            y += 12;
            doc.text(`Generated:  ${dayjs().format('MMMM D, YYYY h:mm A')}`, 30, y);

            y += 25;
            doc.setFontSize(11);
            doc.setTextColor(80);
            doc.text("This document serves as proof that the attendance", 30, y);
            y += 7;
            doc.text("information above was submitted through the", 30, y);
            y += 7;
            doc.text("Attendance Verification form.", 30, y);

            // Footer
            doc.setFontSize(9);
            doc.setTextColor(150);
            doc.text("Generated automatically – keep this file for your records.", 105, 280, { align: "center" });

            const safeName = (currentFirstName + "_" + currentLastName).replace(/\s+/g, "_");
            doc.save(`Attendance_Verification_${safeName}.pdf`);
        }

        function printVerification() {
            const printWindow = window.open('', '_blank', 'width=600,height=700');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Attendance Verification</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 40px; }
                        h1 { text-align: center; margin-bottom: 10px; }
                        hr { margin-bottom: 30px; }
                        p { font-size: 16px; margin: 10px 0; }
                        .footer { margin-top: 50px; color: #666; font-size: 13px; }
                    </style>
                </head>
                <body>
                    <h1>Attendance Verification</h1>
                    <hr>
                    <p><strong>Name:</strong> ${currentFirstName} ${currentLastName}</p>
                    <p><strong>Date of Attendance:</strong> ${currentDateDisplay}</p>
                    <p><strong>Email:</strong> ${currentEmail}</p>
                    <p><strong>Generated:</strong> ${dayjs().format('MMMM D, YYYY h:mm A')}</p>
                    <div class="footer">
                        This document serves as proof of attendance submission.
                    </div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
